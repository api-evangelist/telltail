name: TellTail
description: TellTail was a community-first platform providing community, education, and business support
  to dog breeders, connecting certified breeders with families seeking puppies. Backed by a $3.4M seed
  round led by General Catalyst (April 2022, with Scribble Ventures and Companion Fund). Surfaced as a
  General Catalyst portfolio company and added to the API Evangelist network. The company has since ceased
  operations ("TellTail is closing its doors"); it operated a consumer marketplace and community product
  with no public developer API, documentation, SDK, or event surface.
